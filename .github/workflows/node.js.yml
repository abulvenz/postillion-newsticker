name: Build and Deploy GH Pages

on:
  push:
    branches: [main]
    # Änderungen an der Ticker-Datenbank triggern den Workflow NICHT erneut,
    # sonst würde sich der Job durch seinen eigenen Commit endlos selbst starten.
    paths-ignore:
      - "tickers.js"

  # Newsticker erscheinen Mo/Mi/Fr um 09:30 Europe/Berlin. Cron läuft in UTC:
  # 08:45 UTC = 09:45 MEZ (Winter) bzw. 10:45 MESZ (Sommer) – also immer nach
  # Erscheinen, mit Puffer, und nicht zur vollen Stunde (GitHub-Last).
  schedule:
    - cron: '45 8 * * 1,3,5'
    # Voll-Update: am 1. jedes Monats alle Ausgaben neu crawlen.
    - cron: '30 3 1 * *'

  # erlaubt manuelles Auslösen über die GitHub-Oberfläche
  workflow_dispatch:
    inputs:
      full:
        description: "Voll-Update (alle Ausgaben neu crawlen)"
        type: boolean
        default: false

# Verhindert, dass sich parallele Läufe gegenseitig überschreiben (Datenverlust!).
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # nötig, damit der Job den aktualisierten tickers.js nach main pushen darf
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          FULL_UPDATE: ${{ github.event.schedule == '30 3 1 * *' || inputs.full == true }}

      # Die gecrawlten Daten werden zurück nach main committet, damit die
      # Ticker-Datenbank persistent wächst. Ohne diesen Schritt startete jeder
      # Lauf vom eingefrorenen Stand und verpasste Ausgaben gingen dauerhaft
      # verloren (siehe Issue #14).
      - name: Persist crawled data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickers.js
          if git diff --cached --quiet; then
            echo "Keine neuen Ticker – nichts zu committen."
          else
            git commit -m "data: update tickers [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
